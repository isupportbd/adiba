  <text x="400" y="750" text-anchor="middle" font-family="'Hind Siliguri','Nirmala UI',sans-serif" font-size="24" fill="#A85450" opacity="0.6">পরিবার কক্ষ থেকে ছবি যোগ করুন</text>

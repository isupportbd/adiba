      <stop offset="0" stop-color="#FDF6EC"/>
      <stop offset="1" stop-color="#FBE4E3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <g transform="translate(400,430)">
    <g fill="#F7D0CE">
      <ellipse cx="0" cy="-70" rx="30" ry="70"/><ellipse cx="0" cy="70" rx="30" ry="70"/>
      <ellipse cx="-70" cy="0" rx="70" ry="30"/><ellipse cx="70" cy="0" rx="70" ry="30"/>
      <ellipse cx="-50" cy="-50" rx="55" ry="26" transform="rotate(45 -50 -50)"/>

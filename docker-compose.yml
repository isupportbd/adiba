# ============================================================
# আদিবার স্মৃতিখানা — full self-hosted stack
# PostgreSQL + MinIO + Next.js, ready for Coolify.
#
#   1. cp .env.example .env   (change EVERY password/secret!)
#   2. docker compose up -d --build
#   3. docker compose exec app node scripts/seed.mjs   ← sample data
#
# On Coolify: add this repo, use this compose file, and point your
# domain's proxy at the `app` service on port 3000.
# ============================================================

name: adiba-memory-book

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-adiba_memory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adiba} -d ${POSTGRES_DB:-adiba_memory}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    # Expose the console only on your server (not the public internet).
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first boot.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '$$MINIO_ACCESS_KEY' '$$MINIO_SECRET_KEY' &&
      mc mb -p local/$${MINIO_BUCKET:-adiba-media} &&
      mc anonymous set none local/$${MINIO_BUCKET:-adiba-media} ||
      true ;
      exit 0"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-adiba}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adiba_memory}
      # Auth.js
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-আদিবার স্মৃতিখানা}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # MinIO (in-network — never exposed to the browser)
      MINIO_ENDPOINT: http://minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-adiba-media}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    # If your proxy/Coolify expects plain HTTP on 3000, no ports are needed;
    # uncomment for direct access during setup:
    # ports:
    #   - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  miniodata:
